name: Desktop builds

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            runner: macos-15
            platform: mac
            artifact: macos-arm64
          - name: macOS Intel
            runner: macos-15-intel
            platform: mac
            artifact: macos-x64
          - name: Windows x64
            runner: windows-2022
            platform: win
            artifact: windows-x64
          - name: Linux x64
            runner: ubuntu-24.04
            platform: linux
            artifact: linux-x64
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgtk-3-0t64 libnss3 libasound2t64 libgbm1 libxss1 libfuse2t64 openssh-server
          sudo mkdir -p /run/sshd

      - name: Install dependencies and rebuild native PTY
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node -e "const expected = 'v' + require('./package.json').version; if (process.env.GITHUB_REF_NAME !== expected) throw new Error('Tag must match package version ' + expected)"

      - name: Run integration tests
        run: npm test

      - name: Build native installers
        run: npm run dist:${{ matrix.platform }}

      - name: Smoke-test packaged desktop app
        if: runner.os != 'Linux'
        run: npm run test:packaged

      - name: Smoke-test packaged Linux app with a virtual display
        if: runner.os == 'Linux'
        env:
          AGENT_WORKSPACE_SMOKE_NO_SANDBOX: '1'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1600x1000x24" npm run test:packaged

      - name: Test SSH authentication and remote workspaces
        if: runner.os == 'Linux'
        env:
          AGENT_WORKSPACE_SMOKE_NO_SANDBOX: '1'
          AGENT_WORKSPACE_TEST_SSHD_SUDO: '1'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1600x1000x24" npm run test:ssh

      - name: Test Windows OpenSSH client in a real PTY
        if: runner.os == 'Windows'
        run: npm run test:ssh-client

      - name: Test turnkey installer and installed application
        if: runner.os != 'Linux'
        run: npm run test:install

      - name: Test Linux installer and installed application
        if: runner.os == 'Linux'
        env:
          AGENT_WORKSPACE_SMOKE_NO_SANDBOX: '1'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1600x1000x24" npm run test:install

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.artifact }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload desktop test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-${{ matrix.artifact }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          merge-multiple: true
          path: release
      - name: Include installers and calculate checksums
        run: |
          cp install.sh install.ps1 release/
          cd release
          sha256sum *.dmg *.exe *.AppImage *.deb install.sh install.ps1 > SHA256SUMS
      - name: Publish verified installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes --title "Agent Workspace $GITHUB_REF_NAME"
          fi
