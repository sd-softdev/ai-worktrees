appId: dev.agentworkspace.desktop
productName: Agent Workspace
artifactName: ${name}-${version}-${os}-${arch}.${ext}
directories:
  output: dist
files:
  - out/**/*
  - package.json
asarUnpack:
  - node_modules/node-pty/**/*
  - out/main/askpass.js
icon: build/icon.png
publish:
  provider: github
  owner: sd-softdev
  repo: ai-worktrees
mac:
  category: public.app-category.developer-tools
  target:
    - dmg
  identity: null
win:
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
linux:
  category: Development
  executableName: agent-workspace
  synopsis: Terminal workspace for parallel development with Git worktrees
  target:
    - AppImage
    - deb
